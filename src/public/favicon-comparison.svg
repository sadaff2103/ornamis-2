<svg width="800" height="400" viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="400" fill="#1a0f08"/>
  
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldComp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9d77e" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#c9a961" />
    </linearGradient>
    
    <linearGradient id="deepComp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9a961" />
      <stop offset="50%" stop-color="#8b6914" />
      <stop offset="100%" stop-color="#6b4e0e" />
    </linearGradient>
    
    <linearGradient id="highlightComp" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff9e6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f9d77e" stop-opacity="0.4" />
    </linearGradient>
    
    <filter id="glowComp">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="url(#goldComp)" text-anchor="middle">
    ORNAMIS Favicon - All Sizes Comparison
  </text>
  
  <text x="400" y="70" font-family="Arial, sans-serif" font-size="14" fill="#c9a961" text-anchor="middle" letter-spacing="2">
    GOLD-ON-DARK THEME • ICON ONLY • NO TEXT
  </text>
  
  <!-- Divider Line -->
  <line x1="100" y1="90" x2="700" y2="90" stroke="url(#goldComp)" stroke-width="1" opacity="0.5"/>
  
  <!-- 16x16 -->
  <g transform="translate(120, 150)">
    <rect x="-40" y="-40" width="80" height="80" rx="8" fill="#2c1810" stroke="url(#goldComp)" stroke-width="1" opacity="0.3"/>
    <!-- Simplified 16x16 icon -->
    <path d="M 0 -8 L 6 0 L 0 8 L -6 0 Z" fill="url(#goldComp)" stroke="url(#deepComp)" stroke-width="0.5"/>
    <path d="M -6 0 L -12 -2 L -10 2 Z" fill="url(#goldComp)"/>
    <path d="M 6 0 L 12 -2 L 10 2 Z" fill="url(#goldComp)"/>
    <circle cx="0" cy="-10" r="1" fill="#f9d77e"/>
    
    <text x="0" y="55" font-family="Arial, sans-serif" font-size="12" fill="#f9d77e" text-anchor="middle" font-weight="bold">16×16</text>
    <text x="0" y="70" font-family="Arial, sans-serif" font-size="10" fill="#c9a961" text-anchor="middle">Browser Tabs</text>
    <text x="0" y="85" font-family="Arial, sans-serif" font-size="9" fill="#8b6914" text-anchor="middle">Ultra-Simple</text>
  </g>
  
  <!-- 32x32 -->
  <g transform="translate(280, 150)">
    <rect x="-50" y="-50" width="100" height="100" rx="10" fill="#2c1810" stroke="url(#goldComp)" stroke-width="1" opacity="0.3"/>
    <!-- 32x32 icon -->
    <path d="M 0 -14 L 10 0 L 0 14 L -10 0 Z" fill="url(#goldComp)" stroke="url(#deepComp)" stroke-width="0.6" filter="url(#glowComp)"/>
    <path d="M 0 -14 L 6 0 L 0 0 Z" fill="url(#highlightComp)" opacity="0.7"/>
    <path d="M -10 0 Q -16 -5, -18 -2 Q -17 2, -10 2 Z" fill="url(#goldComp)" stroke="url(#deepComp)" stroke-width="0.4"/>
    <path d="M 10 0 Q 16 -5, 18 -2 Q 17 2, 10 2 Z" fill="url(#goldComp)" stroke="url(#deepComp)" stroke-width="0.4"/>
    <circle cx="0" cy="-16" r="1.5" fill="#f9d77e"/>
    <circle cx="-7" cy="-9" r="1" fill="#fff9e6" opacity="0.8"/>
    <circle cx="7" cy="-9" r="1" fill="#fff9e6" opacity="0.8"/>
    
    <text x="0" y="70" font-family="Arial, sans-serif" font-size="12" fill="#f9d77e" text-anchor="middle" font-weight="bold">32×32</text>
    <text x="0" y="85" font-family="Arial, sans-serif" font-size="10" fill="#c9a961" text-anchor="middle">Bookmarks</text>
    <text x="0" y="100" font-family="Arial, sans-serif" font-size="9" fill="#8b6914" text-anchor="middle">Simplified</text>
  </g>
  
  <!-- 64x64 -->
  <g transform="translate(480, 150)">
    <rect x="-60" y="-60" width="120" height="120" rx="12" fill="#2c1810" stroke="url(#goldComp)" stroke-width="1.5" opacity="0.4"/>
    <!-- 64x64 icon -->
    <path d="M 0 -20 L 14 0 L 0 20 L -14 0 Z" fill="url(#goldComp)" stroke="url(#deepComp)" stroke-width="0.8" filter="url(#glowComp)"/>
    <path d="M 0 -20 L 9 0 L 0 0 Z" fill="url(#highlightComp)" opacity="0.7"/>
    <path d="M 0 -20 L -9 0 L 0 0 Z" fill="url(#deepComp)" opacity="0.4"/>
    <path d="M 0 20 L 9 0 L 0 0 Z" fill="url(#deepComp)" opacity="0.5"/>
    <path d="M -14 0 Q -22 -6, -26 -3 Q -25 3, -14 3 Z" fill="url(#goldComp)" stroke="url(#deepComp)" stroke-width="0.6"/>
    <path d="M 14 0 Q 22 -6, 26 -3 Q 25 3, 14 3 Z" fill="url(#goldComp)" stroke="url(#deepComp)" stroke-width="0.6"/>
    <circle cx="0" cy="-23" r="2" fill="#f9d77e" filter="url(#glowComp)"/>
    <circle cx="-10" cy="-13" r="1.5" fill="#fff9e6" opacity="0.9"/>
    <circle cx="10" cy="-13" r="1.5" fill="#fff9e6" opacity="0.9"/>
    <circle cx="0" cy="23" r="2" fill="#f9d77e"/>
    
    <text x="0" y="85" font-family="Arial, sans-serif" font-size="12" fill="#f9d77e" text-anchor="middle" font-weight="bold">64×64</text>
    <text x="0" y="100" font-family="Arial, sans-serif" font-size="10" fill="#c9a961" text-anchor="middle">Shortcuts</text>
    <text x="0" y="115" font-family="Arial, sans-serif" font-size="9" fill="#8b6914" text-anchor="middle">Full Detail</text>
  </g>
  
  <!-- 128x128 -->
  <g transform="translate(680, 150)">
    <rect x="-60" y="-60" width="120" height="120" rx="15" fill="#2c1810" stroke="url(#goldComp)" stroke-width="2" opacity="0.5"/>
    <!-- 128x128 icon (same as 64 but emphasized) -->
    <path d="M 0 -22 L 16 0 L 0 22 L -16 0 Z" fill="url(#goldComp)" stroke="url(#deepComp)" stroke-width="1" filter="url(#glowComp)"/>
    <path d="M 0 -22 L 10 0 L 0 0 Z" fill="url(#highlightComp)" opacity="0.75"/>
    <path d="M 0 -22 L -10 0 L 0 0 Z" fill="url(#deepComp)" opacity="0.35"/>
    <path d="M 0 22 L 10 0 L 0 0 Z" fill="url(#deepComp)" opacity="0.45"/>
    <path d="M 0 22 L -10 0 L 0 0 Z" fill="url(#deepComp)" opacity="0.55"/>
    <path d="M -16 0 Q -25 -7, -29 -3 Q -28 4, -16 4 Z" fill="url(#goldComp)" stroke="url(#deepComp)" stroke-width="0.7"/>
    <path d="M 16 0 Q 25 -7, 29 -3 Q 28 4, 16 4 Z" fill="url(#goldComp)" stroke="url(#deepComp)" stroke-width="0.7"/>
    <circle cx="0" cy="-26" r="2.5" fill="#f9d77e" filter="url(#glowComp)"/>
    <circle cx="-12" cy="-15" r="1.8" fill="#fff9e6" opacity="0.95"/>
    <circle cx="12" cy="-15" r="1.8" fill="#fff9e6" opacity="0.95"/>
    <circle cx="0" cy="26" r="2.5" fill="#f9d77e" filter="url(#glowComp)"/>
    
    <text x="0" y="85" font-family="Arial, sans-serif" font-size="12" fill="#f9d77e" text-anchor="middle" font-weight="bold">128×128</text>
    <text x="0" y="100" font-family="Arial, sans-serif" font-size="10" fill="#c9a961" text-anchor="middle">General/PWA</text>
    <text x="0" y="115" font-family="Arial, sans-serif" font-size="9" fill="#8b6914" text-anchor="middle">Max Quality</text>
  </g>
  
  <!-- Bottom Info Bar -->
  <rect x="0" y="340" width="800" height="60" fill="rgba(44, 24, 16, 0.5)"/>
  
  <!-- Features -->
  <text x="50" y="365" font-family="Arial, sans-serif" font-size="11" fill="#f9d77e" font-weight="bold">✓ FEATURES:</text>
  <text x="50" y="380" font-family="Arial, sans-serif" font-size="10" fill="#c9a961">💎 Diamond Jewel</text>
  
  <text x="180" y="380" font-family="Arial, sans-serif" font-size="10" fill="#c9a961">🦅 Geometric Wings</text>
  
  <text x="330" y="380" font-family="Arial, sans-serif" font-size="10" fill="#c9a961">👑 Crown Accent</text>
  
  <text x="460" y="380" font-family="Arial, sans-serif" font-size="10" fill="#c9a961">✨ Sparkles</text>
  
  <text x="570" y="380" font-family="Arial, sans-serif" font-size="10" fill="#c9a961">🎨 6-Color Gold</text>
  
  <text x="690" y="380" font-family="Arial, sans-serif" font-size="10" fill="#c9a961">⚡ 1-5KB</text>
  
  <!-- Footer -->
  <text x="400" y="365" font-family="Arial, sans-serif" font-size="9" fill="#8b6914" text-anchor="middle">
    All sizes optimized • SVG scalable • Dark theme (#2c1810) • Icon only (no text)
  </text>
</svg>
